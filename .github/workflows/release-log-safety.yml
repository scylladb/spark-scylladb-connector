name: Release log safety

on:
  pull_request:
    paths:
      - Makefile
      - scripts/release/**
      - .github/workflows/release.yml
      - .github/workflows/release-log-safety.yml
      - build.sbt
  push:
    branches: [scylla-4.x]
    paths:
      - Makefile
      - scripts/release/**
      - .github/workflows/release.yml
      - .github/workflows/release-log-safety.yml
      - build.sbt

permissions:
  contents: read

jobs:
  release-log-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: sbt
      - name: Check release recipes
        run: python3 scripts/release/guard.py check
      - name: Test capture, signing and effective SBT signing settings
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
