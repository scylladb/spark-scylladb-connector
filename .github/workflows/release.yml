name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without publishing to Maven Central'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: do not run tests while releasing'
        default: false

      target-tag:
        type: string
        description: 'target-tag: tag or branch name to release. Use to re-release tagged releases'
        default: scylla-4.x

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read

    steps:
      - name: Check for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "${blocker}" ]]; then
            blocker_title=$(jq -r '.title' <<< "${blocker}")
            blocker_url=$(jq -r '.url' <<< "${blocker}")
            echo "::error title=Release blocked::${blocker_title} (${blocker_url})"
            echo "Open release blocker: ${blocker_title} (${blocker_url})"
            exit 1
          fi
          echo "No open release blockers found."

      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Checkout Code One Commit Before ${{ inputs.target-tag }}
        if: inputs.target-tag != 'scylla-4.x'
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        run: make checkout-one-commit-before

      - name: Checkout release branch
        if: inputs.target-tag == 'scylla-4.x'
        run: git switch -C scylla-4.x origin/scylla-4.x

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: sbt
          gpg-private-key: ${{ secrets.PGP_SECRET }}
          gpg-passphrase: PGP_PASSPHRASE
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

      - name: Configure Git user
        run: |
          git config user.name "ScyllaDB Promoter"
          git config user.email "github-promoter@scylladb.com"

      - name: Prepare release
        run: make release-prepare

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "${blocker}" ]]; then
            blocker_title=$(jq -r '.title' <<< "${blocker}")
            blocker_url=$(jq -r '.url' <<< "${blocker}")
            echo "::error title=Release blocked::${blocker_title} (${blocker_url})"
            echo "Open release blocker: ${blocker_title} (${blocker_url})"
            exit 1
          fi
          echo "No open release blockers found."

      - name: Perform release
        if: inputs.dry-run == false
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: |
          echo "::add-mask::${PGP_PASSPHRASE}"
          echo "::add-mask::${SONATYPE_USERNAME}"
          echo "::add-mask::${SONATYPE_PASSWORD}"
          make release

      - name: Perform release dry-run
        if: inputs.dry-run == true
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: |
          echo "::add-mask::${PGP_PASSPHRASE}"
          echo "::add-mask::${SONATYPE_USERNAME}"
          echo "::add-mask::${SONATYPE_PASSWORD}"
          make release-dry-run

      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbt-stdout
          path: /tmp/spark-connector-release-logs/*.log

      - name: Push changes to SCM
        if: ${{ inputs.dry-run == false && inputs.target-tag == 'scylla-4.x' }}
        run: |
          git status && git log -3 scylla-4.x
          git push origin scylla-4.x --follow-tags -v

      - name: Create GitHub release
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(git describe --tags --abbrev=0 --match 'v*')

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag
